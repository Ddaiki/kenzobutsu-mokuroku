<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建造物調査報告書データベース — 奈文研総目録</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">
      <h1>建造物調査報告書データベース</h1>
      <p class="header-sub">奈良文化財研究所「建造物調査報告書総目録」より — 全 <span id="total-count">—</span> 件</p>
    </div>
    <div class="legend">
      <span class="badge badge-digital">デジタル公開</span>
      <span class="badge badge-ndl">NDL所蔵（複写申請可）</span>
      <span class="badge badge-catalog">所蔵図書館情報あり</span>
      <span class="badge badge-unknown">未確認</span>
    </div>
    <div class="header-links">
      <a href="https://www.nabunken.go.jp/nabunkenblog/2024/02/BD05489876.html" target="_blank" rel="noopener" class="header-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        出典：奈文研ブログ
      </a>
      <a href="https://ddaiki.github.io" target="_blank" rel="noopener" class="header-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        ddaiki.github.io
      </a>
      <a href="https://x.com/Ddaiki" target="_blank" rel="noopener" class="header-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.742l7.727-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @Ddaiki
      </a>
    </div>
  </div>
</header>

<main>
  <aside class="filter-panel">
    <h2>絞り込み</h2>

    <label for="search">キーワード検索</label>
    <input id="search" type="search" placeholder="書名・著者・機関名…" autocomplete="off">

    <label for="pref-filter">都道府県</label>
    <select id="pref-filter">
      <option value="">すべて</option>
    </select>

    <label>公開状況</label>
    <div class="checkbox-group">
      <label><input type="checkbox" class="status-cb" value="digital" checked> デジタル公開</label>
      <label><input type="checkbox" class="status-cb" value="ndl_confirmed"> NDL所蔵（複写申請可）</label>
      <label><input type="checkbox" class="status-cb" value="library_catalog"> 所蔵図書館情報あり</label>
      <label><input type="checkbox" class="status-cb" value="unknown"> 未確認</label>
    </div>

    <label>発行年</label>
    <div class="year-range">
      <input id="year-from" type="number" placeholder="開始" min="1900" max="2030">
      <span>〜</span>
      <input id="year-to" type="number" placeholder="終了" min="1900" max="2030">
    </div>

    <button id="reset-btn">リセット</button>
    <p id="result-count" class="result-count"></p>
  </aside>

  <section class="table-section">
    <div class="table-controls">
      <span class="sort-label">並び順：</span>
      <select id="sort-select">
        <option value="no-asc">No. 昇順</option>
        <option value="year-desc">発行年 新しい順</option>
        <option value="year-asc">発行年 古い順</option>
        <option value="pref-asc">都道府県</option>
      </select>
      <span class="per-page-label">表示件数：</span>
      <select id="per-page">
        <option value="50">50件</option>
        <option value="100">100件</option>
        <option value="200">200件</option>
      </select>
    </div>

    <div class="table-wrap">
      <table id="main-table">
        <thead>
          <tr>
            <th class="col-no">No.</th>
            <th class="col-status">状況</th>
            <th class="col-pref">都道府県</th>
            <th class="col-title">書名</th>
            <th class="col-author">編著者</th>
            <th class="col-year">発行年</th>
            <th class="col-links">リンク</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </section>
</main>

<!-- 詳細モーダル -->
<div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer>
  <p>データ出典：奈良文化財研究所「建造物調査報告書総目録」／ NDL リンク：国立国会図書館サーチ・デジタルコレクション</p>
</footer>

<script src="app.js"></script>
</body>
</html>
